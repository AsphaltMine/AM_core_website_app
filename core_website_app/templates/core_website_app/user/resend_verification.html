{% load static %}
<div class="am-login-wrap am-login-page">
    <div class="am-login-card">
        <img src="{% static 'img/favicon.png' %}" alt="AsphaltMine" class="am-login-logo">
        <h2 class="am-login-title">Resend Verification Email</h2>
        <p class="am-login-subtitle">Enter the email you signed up with.</p>

        <form novalidate action="{% url 'core_website_app_resend_verification' %}" method="post" class="am-login-form">
            {% csrf_token %}
            {% for field in data.resend_form %}
            <div class="am-login-field">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
            {% endfor %}

            <button type="submit" class="am-login-submit">
                Resend Email
            </button>

            <div class="am-login-links">
                <a href="{% url 'core_main_app_login' %}">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to login
                </a>
            </div>
        </form>
    </div>
</div>
