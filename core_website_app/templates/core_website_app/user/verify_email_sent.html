{% load static %}
<div class="am-login-wrap am-login-page">
    <div class="am-login-card">
        <img src="{% static 'img/favicon.png' %}" alt="AsphaltMine" class="am-login-logo">
        <h2 class="am-login-title">Check Your Email</h2>
        <p class="am-login-subtitle">We sent a verification link to <strong>{{ data.email }}</strong>. Click it to activate your account.</p>
        <p class="am-login-subtitle am-login-subtitle--note">Don't see it? Check your spam or junk folder.</p>

        <div class="am-login-links am-login-links--stacked">
            <a href="{% url 'core_website_app_resend_verification' %}">
                Didn't get it? Resend the email
            </a>
            <a href="{% url 'core_main_app_login' %}">
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to login
            </a>
        </div>
    </div>
</div>
